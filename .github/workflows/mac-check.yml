# 맥판 확인 빌드 — mac/ 를 고치고 push 하면 macOS 에서 빌드·자체 테스트·실행 확인을 한다 (릴리즈는 안 만듦).
# artifact:
#   mac-selftest   그리기·확대·타이머 화면을 그린 PNG (맥 없이 눈으로 확인)
#   mac-app        MyZoom-mac.zip (개발판 0.0.0 — 자동 업데이트 안 함)
name: mac-check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac-check.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash mac/scripts/build-app.sh 0.0.0

      - name: Self test (PNG)
        run: mac/dist/MyZoom.app/Contents/MacOS/MyZoom --selftest selftest-out

      - name: Smoke run (launch 15s)
        run: |
          mac/dist/MyZoom.app/Contents/MacOS/MyZoom &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "app alive after 15s"; kill $PID; else echo "app exited early"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-selftest
          path: selftest-out/

      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: mac/dist/MyZoom-mac.zip
